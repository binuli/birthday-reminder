<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Reminder</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <main class="container">

        <header class="header">
            <h1>🎂 Birthday Reminder</h1>
            <p>Never forget a special day!</p>
        </header>

        <section class="today-section">
            <h2>Today's Birthdays</h2>
            <p id="current-date"></p>

            <div id="today-birthdays" class="birthday-list">
                Loading...
            </div>
        </section>

        <section class="add-birthday-section">
            <h2>Add a Birthday</h2>

            <form id="birthday-form">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Enter person's name" required>
                </div>

                <div class="form-group">
                    <label for="dateOfBirth">Date of Birth</label>
                    <input type="date" id="dateOfBirth" required>
                </div>

                <button type="submit">Add Birthday</button>

                <p id="form-message"></p>

            </form>
        </section>

        <section class="all-birthdays-section">
            <h2>All Birthdays</h2>

            <div id="all-birthdays" class="birthday-list">
                Loading...
            </div>
        </section>

        <dialog id="edit-dialog">
            <h2>Edit Birthday</h2>

            <form id="edit-birthday-form">

                <div class="form-group">
                    <label for="edit-name">Name</label>
                    <input type="text" id="edit-name" required maxlength="100">
                </div>

                <div class="form-group">
                    <label for="edit-date">Date of Birth</label>
                    <input type="date" id="edit-date" required>
                </div>

                <div class="dialog-actions">
                    <button type="submit">Save Changes</button>
                    <button type="button" id="cancel-edit">
                        Cancel
                    </button>
                </div>

                <p id="edit-message"></p>
            </form>
        </dialog>

    </main>

    <script src="/js/app.js"></script>
</body>

</html>
